[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gstar-opd-formal"
version = "0.1.0"
description = "Isolated matched Adaptive FastOPD and original U2 study"
requires-python = ">=3.11,<3.14"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]
train = ["torch==2.8.0", "transformers==4.57.6", "peft==0.17.1", "numpy==2.2.6", "math-verify[antlr4_13_2]==0.8.0"]

[project.scripts]
gstar-formal = "gstar_opd_formal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gstar_opd_formal*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/gstar_opd_formal/evaluation/graders/vendor", "provenance", "archives", "releases"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gstar_opd_formal"]

[tool.ruff.lint.per-file-ignores]
"src/gstar_opd_formal/runtime/notebooks.py" = ["E501"]
